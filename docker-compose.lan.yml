version: '3.8'

services:
  db:
    image: postgres:${POSTGRES_VERSION:-15-alpine}
    container_name: activation_db_lan
    environment:
      POSTGRES_USER: ${DB_USER:-activate_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-YourSuperSecretPassword}
      POSTGRES_DB: ${DB_NAME:-activation_db}
    volumes:
      - pgdata_lan:/var/lib/postgresql/data
    networks:
      - activation_net_lan
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: activation_backend_lan
    environment:
      ConnectionStrings__DefaultConnection: "Host=${DB_HOST:-db};Port=${DB_PORT:-5432};Database=${DB_NAME:-activation_db};Username=${DB_USER:-activate_admin};Password=${DB_PASSWORD:-YourSuperSecretPassword}"
      JwtSettings__SecretKey: ${JWT_SECRET:-YourSuperSecretKeyGeneratedHere}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    depends_on:
      - db
    networks:
      - activation_net_lan
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: activation_frontend_lan
    ports:
      - "${FRONTEND_HTTP_PORT:-80}:80"
    volumes:
      # 挂载专为局域网无 HTTPS 设计的配置文件，覆盖默认的 nginx.conf
      - ./frontend/nginx.lan.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - activation_net_lan
    restart: unless-stopped

networks:
  activation_net_lan:
    driver: bridge

volumes:
  pgdata_lan:
