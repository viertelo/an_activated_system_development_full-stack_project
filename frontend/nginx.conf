# HTTP (80) 重定向至 HTTPS (443)，杜绝明文通信
server {
    listen 80;
    server_name localhost; # 实际部署时应替换为真实域名，例如 example.com

    # 强制将所有 HTTP 请求重定向到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS (443) 安全通信
server {
    listen 443 ssl http2;
    server_name localhost; # 同上，替换为真实域名

    # SSL 证书配置 (默认给一个占位符路径，需在部署时映射真实证书文件)
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # 强化 TLS 安全策略，防中间人攻击，禁用不安全的 SSLv3 和 TLS 1.0/1.1
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    
    # HSTS (强制使用 HTTPS)，防劫持
    add_header Strict-Transport-Security "max-age=63072000" always;

    # 静态前端资源
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # 必须加上 $uri.html，否则 Next.js export 模式下直接访问 /admin 会返回 404
        try_files $uri $uri.html $uri/ /index.html;
    }

    # 反向代理请求到后端的 Docker 容器网络
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
